name: Generate Text Video

'on':
  workflow_dispatch:
  push:
    paths:
      - title.txt
      - .github/workflows/video.yml

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Generate MP4
        shell: bash
        run: |
          mkdir -p output
          ffmpeg -y \
            -f lavfi \
            -i "color=c=0x101827:s=720x1280:r=30:d=8" \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=title.txt:fontcolor=white:fontsize=52:x=(w-text_w)/2:y=(h-text_h)/2:box=1:boxcolor=black@0.6:boxborderw=24,fade=t=in:st=0:d=0.7,fade=t=out:st=7:d=1" \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/text-video.mp4

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: Text-Video
          path: output/text-video.mp4
